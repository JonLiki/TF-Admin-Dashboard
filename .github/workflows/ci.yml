name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tf_dashboard_ci?schema=public
  AUTH_SECRET: ci-build-secret-not-for-real-use-only

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tf_dashboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Schema has no real migration history yet (see roadmap item #4) — db push
      # stands the schema up for build-time prerendering. Swap for
      # `prisma migrate deploy` once a baseline migration exists.
      - run: npx prisma db push

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
